name: Build

on:
  workflow_dispatch:

jobs:
  prepre:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Tag
        run: echo "VERSION=$(git describe --tags $(git rev-list --tags --max-count=1))" >> $GITHUB_OUTPUT

  pre:
    needs:
      - prepre
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check
        run: |
          if diff -q tag <(echo "$VERSION"); then
            echo "No changes in upstream."
            exit 0
          else
            echo "$VERSION" > tag
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "$VERSION"
            git push origin main
            git tag -a "$VERSION"
            git push origin "$VERSION"
          fi

  test-scrcpy-server:
    needs:
      - prepre
      - pre
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle # use native gradle instead of ./gradlew in scripts
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Test scrcpy-server
        run: release/test_server.sh

  build-scrcpy-server:
    needs:
      - prepre
      - pre
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle # use native gradle instead of ./gradlew in scripts
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Build
        run: release/build_server.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-server
          path: release/work/build-server/server/scrcpy-server

  test-build-scrcpy-server-without-gradle:
    needs:
      - prepre
      - pre
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Build without gradle
        run: server/build_without_gradle.sh

  test-client:
    needs:
      - prepre
      - pre
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

        # Same as build-linux-x86_64
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm ffmpeg libavcodec-dev \
             libavdevice-dev libavformat-dev libavutil-dev libswresample-dev \
             libusb-1.0-0 libusb-1.0-0-dev libv4l-dev \
             libasound2-dev libpulse-dev \
             libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
             libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
             libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
             libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
             libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

        # SDL3 is not available in Ubuntu yet
      - name: Install SDL3
        run: |
          app/deps/sdl.sh linux native shared

      - name: Test
        run: |
          export PKG_CONFIG_PATH="$PWD"/app/deps/work/install/linux-native-shared/lib/pkgconfig
          export LD_LIBRARY_PATH="$PWD"/app/deps/work/install/linux-native-shared/lib
          release/test_client.sh

  build-linux-x86_64:
    needs:
      - prepre
      - pre
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Check architecture
        run: |
          arch=$(uname -m)
          if [[ "$arch" != x86_64 ]]
          then
              echo "Unexpected architecture: $arch" >&2
              exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

        # https://wiki.libsdl.org/SDL3/README-linux#build-dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm ffmpeg libavcodec-dev \
             libavdevice-dev libavformat-dev libavutil-dev libswresample-dev \
             libusb-1.0-0 libusb-1.0-0-dev libv4l-dev \
             libasound2-dev libpulse-dev \
             libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
             libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
             libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
             libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
             libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Build
        run: release/build_linux.sh x86_64

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
          cd release/work/build-linux-x86_64
          mkdir dist-tar
          cd dist-tar
          tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-x86_64-intermediate
          path: release/work/build-linux-x86_64/dist-tar/

  build-win32:
    needs:
      - prepre
      - pre
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build
        run: release/build_windows.sh 32

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
          cd release/work/build-win32
          mkdir dist-tar
          cd dist-tar
          tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-win32-intermediate
          path: release/work/build-win32/dist-tar/

  build-win64:
    needs:
      - prepre
      - pre
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build
        run: release/build_windows.sh 64

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
          cd release/work/build-win64
          mkdir dist-tar
          cd dist-tar
          tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

  build-macos-aarch64:
    needs:
      - prepre
      - pre
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Check architecture
        run: |
          arch=$(uname -m)
          if [[ "$arch" != arm64 ]]
          then
              echo "Unexpected architecture: $arch" >&2
              exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Install dependencies
        run: |
          brew install meson nasm libiconv zlib automake autoconf libtool

      - name: Build
        env:
          # the default Xcode (and macOS SDK) version can be found at
          # <https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md#xcode>
          #
          # then the minimal supported deployment target of that macOS SDK can be found at
          # <https://developer.apple.com/support/xcode/#minimum-requirements>
          MACOSX_DEPLOYMENT_TARGET: 10.13
        run: release/build_macos.sh aarch64

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
          cd release/work/build-macos-aarch64
          mkdir dist-tar
          cd dist-tar
          tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-aarch64-intermediate
          path: release/work/build-macos-aarch64/dist-tar/

  build-macos-x86_64:
    needs:
      - prepre
      - pre
    runs-on: macos-15-intel
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Check architecture
        run: |
          arch=$(uname -m)
          if [[ "$arch" != x86_64 ]]
          then
              echo "Unexpected architecture: $arch" >&2
              exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Install dependencies
        run:
          brew install meson nasm libiconv zlib automake
          # autoconf and libtool are already installed on macos-13

      - name: Build
        env:
          # the default Xcode (and macOS SDK) version can be found at
          # <https://github.com/actions/runner-images/blob/main/images/macos/macos-13-Readme.md#xcode>
          #
          # then the minimal supported deployment target of that macOS SDK can be found at
          # <https://developer.apple.com/support/xcode/#minimum-requirements>
          MACOSX_DEPLOYMENT_TARGET: 10.13
        run: release/build_macos.sh x86_64

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
          cd release/work/build-macos-x86_64
          mkdir dist-tar
          cd dist-tar
          tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-x86_64-intermediate
          path: release/work/build-macos-x86_64/dist-tar/

  package-linux-x86_64:
    needs:
      - prepre
      - build-scrcpy-server
      - build-linux-x86_64
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download build-linux-x86_64
        uses: actions/download-artifact@v8
        with:
          name: build-linux-x86_64-intermediate
          path: release/work/build-linux-x86_64/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
          cd release/work/build-linux-x86_64
          tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_client.sh linux-x86_64 tar.gz

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: release/output/

  package-win32:
    needs:
      - prepre
      - build-scrcpy-server
      - build-win32
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download build-win32
        uses: actions/download-artifact@v8
        with:
          name: build-win32-intermediate
          path: release/work/build-win32/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
          cd release/work/build-win32
          tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_client.sh win32 zip

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-win32
          path: release/output/

  package-win64:
    needs:
      - prepre
      - build-scrcpy-server
      - build-win64
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download build-win64
        uses: actions/download-artifact@v8
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
          cd release/work/build-win64
          tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_client.sh win64 zip

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-win64
          path: release/output

  package-macos-aarch64:
    needs:
      - prepre
      - build-scrcpy-server
      - build-macos-aarch64
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download build-macos-aarch64
        uses: actions/download-artifact@v8
        with:
          name: build-macos-aarch64-intermediate
          path: release/work/build-macos-aarch64/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
          cd release/work/build-macos-aarch64
          tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_client.sh macos-aarch64 tar.gz

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-aarch64
          path: release/output/

  package-macos-x86_64:
    needs:
      - prepre
      - build-scrcpy-server
      - build-macos-x86_64
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download build-macos
        uses: actions/download-artifact@v8
        with:
          name: build-macos-x86_64-intermediate
          path: release/work/build-macos-x86_64/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
          cd release/work/build-macos-x86_64
          tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_client.sh macos-x86_64 tar.gz

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-x86_64
          path: release/output/

  release:
    needs:
      - prepre
      - build-scrcpy-server
      - package-linux-x86_64
      - package-win32
      - package-win64
      - package-macos-aarch64
      - package-macos-x86_64
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepre.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          fetch-depth: 0

      - name: Workaround
        run: |
          git checkout "$VERSION"
          sed -Ei 's#^([ \t]*)(| VIRTUAL_DISPLAY_FLAG_ALWAYS_UNLOCKED)#\1// \2#' server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download release-linux-x86_64
        uses: actions/download-artifact@v8
        with:
          name: release-linux-x86_64
          path: release/output/

      - name: Download release-win32
        uses: actions/download-artifact@v8
        with:
          name: release-win32
          path: release/output/

      - name: Download release-win64
        uses: actions/download-artifact@v8
        with:
          name: release-win64
          path: release/output/

      - name: Download release-macos-aarch64
        uses: actions/download-artifact@v8
        with:
          name: release-macos-aarch64
          path: release/output/

      - name: Download release-macos-x86_64
        uses: actions/download-artifact@v8
        with:
          name: release-macos-x86_64
          path: release/output/

      - name: Package server
        run: release/package_server.sh

      - name: Generate checksums
        run: release/generate_checksums.sh

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/output/*

  delete-artifact:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: github-pages
